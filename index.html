  if (state === 'reconnect' && !syncLost) syncAutoTried = false;
  syncLost = (state === 'reconnect');
  btn.classList.toggle('alert', syncLost);
  label.parentElement.classList.toggle('warn', syncLost);
  document.title = (syncLost ? '⚠ ' : '') + BASE_TITLE;
  btn.title = syncLost ? 'Your notes are safe in this browser. Click to resume saving to the folder.' : 'Pick a folder to autosave notes into';

  if (state === 'connected') {
    label.textContent = 'Synced: ' + (name || 'folder');
    btn.querySelector('.btn-label').textContent = ' Disconnect';
    btn.dataset.action = 'disconnect-folder';
    btn.style.display = '';
  } else if (state === 'reconnect') {
    label.textContent = '⚠ Not saved to folder';
    btn.querySelector('.btn-label').textContent = ' Reconnect now';
    btn.dataset.action = 'reconnect-folder';
    btn.style.display = '';
  } else if (state === 'unsupported') {
    label.textContent = 'Folder sync needs Chrome or Edge';
    btn.style.display = 'none';
  } else {
    label.textContent = 'Folder sync: off';
    btn.querySelector('.btn-label').textContent = ' Connect Folder';
    btn.dataset.action = 'connect-folder';
    btn.style.display = '';
  }
}

// On startup: if a folder was connected before, try to resume silently.
// (Browsers don't remember write permission across restarts, so this may
// land on "reconnect" — one click, no folder picker, just a permission grant.)
async function initFolderSync() {
  if (!FS_SUPPORTED) { setSyncUI('unsupported'); return; }
  let stored = null;
  try { stored = await idbGet('dir'); } catch {}
  if (!stored) { setSyncUI('off'); return; }

  dirHandle = stored;
  const granted = await dirHandle.queryPermission({ mode: 'readwrite' }).catch(() => 'prompt');
  if (granted === 'granted') {
    await reconcileFolder(false);
  } else {
    setSyncUI('reconnect', dirHandle.name);
  }
}

async function connectFolder() {
  if (!FS_SUPPORTED) return;
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    dirHandle = handle;
    await idbSet('dir', handle);
    await reconcileFolder(true);
  } catch (err) {
    if (err.name !== 'AbortError') console.error('Folder connect failed', err);
  }
}

async function reconnectFolder() {
  if (!dirHandle) return;
  const ok = await verifyPermission(dirHandle, 'readwrite');
  if (ok) await reconcileFolder(false);
  else alert('Permission wasn\'t granted. Click "Connect Folder" to choose the folder again.');
}

async function disconnectFolder() {
  dirHandle = null;
  clearTimeout(folderSyncTimeout);
  try { await idbDel('dir'); } catch {}
  setSyncUI('off');
}

async function readFolderFile() {
  try {
    const fh  = await dirHandle.getFileHandle(SYNC_FILENAME);
    const txt = await (await fh.getFile()).text();
    const parsed = JSON.parse(txt);
    const list = Array.isArray(parsed) ? parsed : parsed.notes;
    if (!Array.isArray(list)) return null;
    return { notes: list, updatedAt: (!Array.isArray(parsed) && +parsed.updatedAt) || 0, txt };
  } catch { return null; }   // no file yet — that's fine
}

function adoptFolderCopy(f) {
  notes = f.notes;
  localStorage.setItem('notepad_notes', JSON.stringify(notes));
  localStorage.setItem('notepad_updated', String(f.updatedAt));
  localStorage.setItem('notepad_synced',  String(f.updatedAt));
  refreshAfterExternalLoad();
}

function backupLoser(text) {
  try { localStorage.setItem('notepad_backup', text); localStorage.setItem('notepad_backup_time', new Date().toISOString()); } catch {}
}

// Never throw away what was typed while the folder was disconnected.
// isFirstConnect=true  -> just picked the folder, ask if it already has notes.
// isFirstConnect=false -> app opened / reconnected after sleep: keep local edits made since the last folder save.
async function reconcileFolder(isFirstConnect) {
  if (!dirHandle) return;
  const ok = await verifyPermission(dirHandle, 'readwrite');
  if (!ok) { setSyncUI('reconnect', dirHandle.name); return; }

  const f = await readFolderFile();
  const sameContent = f && JSON.stringify(f.notes) === JSON.stringify(notes);

  if (!f) {
    await writeToFolder();
  } else if (sameContent) {
    await writeToFolder();
  } else if (isFirstConnect) {
    const useFolder = confirm(
      `This folder already has ${f.notes.length} saved note(s).\n\n` +
      `OK = Load those notes (replaces what's currently open)\n` +
      `Cancel = Keep what's open now and save it into this folder`
    );
    backupLoser(useFolder ? JSON.stringify({ notes }) : f.txt);
    if (useFolder) adoptFolderCopy(f); else await writeToFolder();
  } else {
    const stamp  = +localStorage.getItem('notepad_updated') || 0;
    const synced = +localStorage.getItem('notepad_synced')  || 0;
    const localDirty  = stamp > synced;                             // typed since last folder save
    const unknown     = stamp === 0 && synced === 0 && notes.length > 0;  // first run of this version
    const fileChanged = f.updatedAt > synced;                       // folder edited elsewhere

    if (!localDirty && !unknown) {
      adoptFolderCopy(f);
    } else {
      let useFolder = false;                                        // normal after sleep: keep my text
      if (unknown || fileChanged) {
        useFolder = !confirm(
          `The folder and this page both have changes the other doesn't.\n\n` +
          `OK = Keep what's on this page (overwrites the folder copy)\n` +
          `Cancel = Load the folder copy instead`
        );
      }
      backupLoser(useFolder ? JSON.stringify({ notes }) : f.txt);   // safety copy of whichever version loses
      if (useFolder) adoptFolderCopy(f); else await writeToFolder();
    }
  }

  setSyncUI('connected', dirHandle.name);
}

function refreshAfterExternalLoad() {
  renderNotesList();
  if (isSplitMode) { renderSplitPane('left'); renderSplitPane('right'); }
  else if (notes.length > 0) selectNote(notes[0].id);
  else showEmpty();
  updateFooter();
}

async function writeToFolder() {
  if (!dirHandle) return;
  const ok = await verifyPermission(dirHandle, 'readwrite');
  if (!ok) { setSyncUI('reconnect', dirHandle.name); return; }
  try {
    const fileHandle = await dirHandle.getFileHandle(SYNC_FILENAME, { create: true });
    const writable    = await fileHandle.createWritable();
    const stamp = +localStorage.getItem('notepad_updated') || 0;
    await writable.write(JSON.stringify({ version: 1, exported: new Date().toISOString(), updatedAt: stamp, notes }, null, 2));
    await writable.close();
    localStorage.setItem('notepad_synced', String(stamp));
    if (syncLost) setSyncUI('connected', dirHandle.name);
  } catch (err) {
    console.error('Folder sync write failed', err);
    setSyncUI('reconnect', dirHandle ? dirHandle.name : '');
  }
}

async function checkFolderPermission() {
  if (!dirHandle || syncLost) return;
  try {
    if ((await dirHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') setSyncUI('reconnect', dirHandle.name);
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFolderPermission(); });
window.addEventListener('focus', checkFolderPermission);
setInterval(checkFolderPermission, 30000);
// first click anywhere while disconnected -> pop the browser's permission prompt automatically
document.addEventListener('pointerdown', async () => {
  if (!syncLost || syncAutoTried || !dirHandle) return;
  syncAutoTried = true;
  if (await verifyPermission(dirHandle, 'readwrite')) await reconcileFolder(false);
}, true);

function debounceFolderSync() {
  if (!dirHandle) return;
  clearTimeout(folderSyncTimeout);
  folderSyncTimeout = setTimeout(writeToFolder, 500);
}

// ══════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAllExportMenus();
  if (e.ctrlKey && e.key === 'n') { e.preventDefault(); createNote(defaultTemplate()); }
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    save();
    if (!isSplitMode) {
      $('saveStatus').textContent = 'Saved';
      $('saveIndicator').classList.add('show');
      setTimeout(() => $('saveIndicator').classList.remove('show'), 1200);
    }
  }
  if (e.key === 'Tab' && (e.target === $('editorTextarea') || e.target === $('splitTextareaLeft') || e.target === $('splitTextareaRight'))) {
    e.preventDefault();
    const ta  = e.target;
    const s   = ta.selectionStart, end = ta.selectionEnd;
    ta.value  = ta.value.substring(0, s) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = s + 4;
    if (ta === $('editorTextarea')) onContentChange();
    else if (ta === $('splitTextareaLeft')) onSplitContentChange('left');
    else onSplitContentChange('right');
  }
});

// ── Start ──
init();
</script>
</body>
</html>
